<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS Cocina</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="cocina.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

  <header class="topbar-kds">

    <div class="topbar-left">
      <img src="/img/logo.png" alt="Logo" class="logo-kds">
  
      <div class="brand-text">
        <h2>El Cordón y la Rosa</h2>
        <span>Restaurante</span>
      </div>
    </div>
  
    <div class="topbar-center">
      <h1>VISTA - COCINA</h1>
    </div>
  
    <div class="topbar-right">
      <button class="logout-btn" onclick="cerrarSesionCocina()">
        Cerrar sesión
      </button>
    </div>
  
  </header>

    <div id="pedidos" class="grid"></div>
  </div>

  <script src="cocina.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
