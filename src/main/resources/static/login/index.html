<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .login-box {
      max-width: 420px;
      margin: 80px auto;
      background: #fffaf3;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .login-box h1 {
      margin-top: 0;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #d9a441;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .msg {
      text-align: center;
      margin-bottom: 12px;
      color: #c62828;
      font-weight: bold;
    }

    .ok {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Iniciar sesión</h1>
    <div id="msg"></div>

    <form method="post" action="/login">
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById("msg");

    if (params.get("error") === "true") {
      msg.innerHTML = '<p class="msg">Usuario o contraseña incorrectos</p>';
    }

    if (params.get("logout") === "true") {
      msg.innerHTML = '<p class="msg ok">Sesión cerrada correctamente</p>';
    }
  </script>
</body>
</html>
