<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="caja.css">
</head>
<body>

  <header class="topbar-kds">

    <div class="topbar-left">
      <img src="/img/logo.png" alt="Logo" class="logo-kds">
  
      <div class="brand-text">
        <h2>El Cordón y la Rosa</h2>
        <span>Restaurante</span>
      </div>
    </div>
  
    <div class="topbar-center">
      <h1>VISTA - CAJA</h1>
    </div>
  
    <div class="topbar-right">
      <button class="logout-btn" onclick="cerrarSesionCaja()">
        Cerrar sesión
      </button>
    </div>
  
  </header>
  
  <div class="reporte-filtros">
    <input type="date" id="fechaInicioReporte">
    <input type="date" id="fechaFinReporte">

    <button id="btnEnviarReporteAdmin" class="btn-whatsapp">
        🟢 Enviar reporte al administrador
    </button>
</div>

    <div class="caja-layout">
      <!-- IZQUIERDA: MENÚ -->
      <section class="menu-panel">
        <div class="menu-header">
          <h2>Menú</h2>

          <div class="filtros-menu">
            <input
              type="text"
              id="buscador-productos"
              placeholder="Buscar plato..."
              oninput="aplicarFiltros()"
            >

            <select id="filtro-categoria" onchange="aplicarFiltros()">
              <option value="">Todas las categorías</option>
            </select>
          </div>
        </div>

        <div id="menu-productos" class="menu-categorias"></div>
      </section>

      <!-- DERECHA: PEDIDO -->
      <aside class="pedido-panel">
        <section class="pedido-actual-box">
          <h2>Pedido actual</h2>
          <ul id="lista" class="pedido-lista"></ul>
          <p class="total-texto">Total: S/ <span id="total">0.00</span></p>
          <div class="metodo-pago">
