<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="caja.css">
</head>
<body>

  <div class="page">
    <div class="topbar">
      <h1>🧾 Caja</h1>
      <button class="logout-btn" onclick="cerrarSesionCaja()">Cerrar sesión</button>
    </div>

    <section>
      <h2>Menú</h2>
      <div class="menu" id="menu-productos"></div>
    </section>

    <section>
      <h2>Pedido actual</h2>
      <ul id="lista" class="pedido-lista"></ul>
      <p class="total-texto">Total: S/ <span id="total">0.00</span></p>
      <button class="enviar" onclick="enviarPedido()">Enviar</button>
    </section>

    <section>
      <h2>Pedidos Listos</h2>
      <div id="listos" class="listos-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
