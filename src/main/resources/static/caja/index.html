<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="caja.css">
</head>
<body>

  <div class="page">
    <div class="topbar">
      <h1>🧾 Caja</h1>
      <div class="topbar-actions">
        <button class="logout-btn" onclick="cerrarSesionCaja()">Cerrar sesión</button>
      </div>
    </div>

    <div class="caja-layout">
      <!-- IZQUIERDA: MENÚ -->
      <section class="menu-panel">
        <div class="menu-header">
          <h2>Menú</h2>

          <div class="filtros-menu">
            <input
              type="text"
              id="buscador-productos"
              placeholder="Buscar plato..."
              oninput="aplicarFiltros()"
            >

            <select id="filtro-categoria" onchange="aplicarFiltros()">
              <option value="">Todas las categorías</option>
            </select>
          </div>
        </div>

        <div id="menu-productos" class="menu-categorias"></div>
      </section>

      <!-- DERECHA: PEDIDO -->
      <aside class="pedido-panel">
        <section class="pedido-actual-box">
          <h2>Pedido actual</h2>
          <ul id="lista" class="pedido-lista"></ul>
          <p class="total-texto">Total: S/ <span id="total">0.00</span></p>
          <button class="enviar" onclick="enviarPedido()">Enviar</button>
        </section>

        <section class="pedidos-listos-box">
          <h2>Pedidos listos</h2>
          <div id="listos" class="listos-grid"></div>
        </section>
      </aside>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
